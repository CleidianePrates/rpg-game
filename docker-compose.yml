version: "3.9"

services:
  rpg-game:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_AZURE_OPENAI_ENDPOINT: ${VITE_AZURE_OPENAI_ENDPOINT}
        VITE_AZURE_OPENAI_API_KEY: ${VITE_AZURE_OPENAI_API_KEY}
        VITE_AZURE_OPENAI_DEPLOYMENT: ${VITE_AZURE_OPENAI_DEPLOYMENT}
        VITE_AZURE_OPENAI_API_VERSION: ${VITE_AZURE_OPENAI_API_VERSION}
    container_name: eldoria-rpg
    ports:
      - "3000:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

  rpg-dev:
    image: node:20-alpine
    container_name: eldoria-rpg-dev
    working_dir: /app
    env_file: .env
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"
    profiles:
      - dev
